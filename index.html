<!doctype html>
<html lang="en">
<head>
    <meta name="game-uuid" content="ff62e46e-212d-4a61-8085-2b99bb5fc760" />

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

<title>Stack</title>
<script src="./aigram-bridge.js"></script>
<style>
  :root { --bg: #060716; --accent: #ffc555; --warn: #ff5060; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: var(--bg);
    color: #fff;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Courier New", monospace;
    overflow: hidden; user-select: none; touch-action: none;
    overscroll-behavior: none;
  }
  body { border-radius: 24px; overflow: hidden; position: relative; }
  #stage { position: absolute; inset: 0; display: block; width: 100%; height: 100%; background: var(--bg); }

  .hud {
    position: absolute; left: 0; right: 0; top: 0;
    text-align: center; pointer-events: none;
    padding-top: env(safe-area-inset-top);
  }
  .hud .label {
    margin-top: 26px; font-size: 13px; letter-spacing: 0.42em;
    color: var(--accent); text-transform: uppercase;
    text-shadow: 0 0 12px rgba(255,197,85,0.55);
    opacity: 0.9;
  }
  .hud .counter {
    margin-top: 6px; font-size: 72px; font-weight: 200; line-height: 1;
    color: #fff; letter-spacing: 0.04em;
    text-shadow:
      0 0 18px rgba(255,255,255,0.6),
      0 0 42px rgba(255,197,85,0.38),
      0 4px 24px rgba(255,197,85,0.15);
    font-variant-numeric: tabular-nums;
    transition: transform 0.14s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .hud .counter.burst { transform: scale(1.18); }
  .hud .combo-row {
    margin-top: 10px;
    font-size: 12px; letter-spacing: 0.28em;
    color: rgba(255,255,255,0.55); text-transform: uppercase;
    display: flex; gap: 24px; justify-content: center; align-items: center;
  }
  .hud .combo { color: #fff; text-shadow: 0 0 10px var(--accent); transition: transform 0.18s ease, color 0.2s ease; }
  .hud .combo.big { transform: scale(1.4); color: #ff6ad5; text-shadow: 0 0 14px #ff6ad5; }
  .hud .best { color: rgba(255,255,255,0.45); }
  .hud .best b { color: rgba(255,255,255,0.78); font-weight: 700; }
  .hud .perfect-banner {
    position: absolute; left: 0; right: 0; top: 0;
    text-align: center;
    font-size: 22px; font-weight: 800;
    color: #ff6ad5;
    letter-spacing: 0.28em;
    text-shadow: 0 0 14px #ff6ad5, 0 0 28px rgba(255,106,213,0.7);
    transform: translateY(0); opacity: 0;
    transition: transform 0.45s ease, opacity 0.45s ease;
    padding-top: calc(120px + env(safe-area-inset-top));
    pointer-events: none;
  }
  .hud .perfect-banner.flash {
    opacity: 1;
    transform: translateY(20px);
  }
  .hud .hint {
    margin-top: 22px; font-size: 13px; letter-spacing: 0.28em;
    color: rgba(255,255,255,0.42); text-transform: uppercase;
    animation: st-pulse 2.4s ease-in-out infinite;
  }
  .hud .hint.hidden { opacity: 0; animation: none; transition: opacity 0.5s ease; }
  @keyframes st-pulse {
    0%, 100% { opacity: 0.55; }
    50%      { opacity: 1; }
  }

  .theme-dots {
    position: absolute; right: 14px; top: 14px;
    display: flex; gap: 8px; padding: 8px;
    pointer-events: auto;
    padding-top: calc(8px + env(safe-area-inset-top));
  }
  .theme-dots .dot {
    width: 14px; height: 14px; border-radius: 50%;
    cursor: pointer; opacity: 0.5;
    transition: transform 0.18s ease, opacity 0.18s ease;
    box-shadow: 0 0 8px currentColor;
  }
  .theme-dots .dot.active { opacity: 1; transform: scale(1.18); }
  .theme-dots .dot[data-t="prism"]  { background: #ffc555; color: #ffc555; }
  .theme-dots .dot[data-t="sunset"] { background: #ff6a3d; color: #ff6a3d; }
  .theme-dots .dot[data-t="ocean"]  { background: #4cc3ff; color: #4cc3ff; }

  .credits {
    position: absolute; left: 0; right: 0; bottom: 16px;
    text-align: center; color: rgba(255,255,255,0.22);
    font-size: 11px; letter-spacing: 0.32em; text-transform: uppercase;
    pointer-events: none; padding-bottom: env(safe-area-inset-bottom);
  }

  .gameover {
    position: absolute; inset: 0;
    display: none; flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    z-index: 20;
  }
  .gameover.show { display: flex; }
  .gameover-title {
    font-size: 22px;
    color: var(--warn);
    letter-spacing: 0.20em;
    text-transform: uppercase;
    text-shadow: 0 0 14px rgba(255,80,96,0.7);
    margin-bottom: 8px;
  }
  .gameover-score {
    font-size: 56px; font-weight: 700; color: #fff;
    text-shadow: 0 0 20px rgba(255,255,255,0.5);
    margin-bottom: 6px;
    font-variant-numeric: tabular-nums;
  }
  .gameover-stats {
    font-size: 13px; letter-spacing: 0.24em;
    color: rgba(255,255,255,0.65); text-transform: uppercase;
    margin-bottom: 28px;
  }
  .gameover-btn {
    background: transparent;
    border: 2px solid var(--accent);
    color: var(--accent);
    font-family: inherit;
    font-size: 14px;
    letter-spacing: 0.24em;
    padding: 12px 28px;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(255,197,85,0.4);
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .gameover-btn:active { transform: scale(0.95); background: rgba(255,197,85,0.12); }
  .gameover-row { display: flex; gap: 10px; align-items: center; justify-content: center; }
  .gameover-btn--ghost {
    background: transparent;
    border: 1.5px solid rgba(255,255,255,0.35);
    color: rgba(255,255,255,0.8);
    box-shadow: none;
  }
  .gameover-btn--ghost:active { background: rgba(255,255,255,0.08); }

  /* === Leaderboard === */
  .gg-lb-toggle {
    position: absolute; left: 14px; top: 14px;
    padding: 8px; padding-top: calc(8px + env(safe-area-inset-top));
    pointer-events: auto; z-index: 10;
  }
  .gg-lb-toggle button {
    width: 30px; height: 30px;
    background: rgba(0,0,0,0.42);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 50%; color: #fff;
    font-size: 15px; line-height: 1;
    cursor: pointer; padding: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: inherit;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.15s ease;
  }
  .gg-lb-toggle button:active { transform: scale(0.92); }

  .gg-lb-backdrop {
    position: absolute; inset: 0; z-index: 200;
    display: none; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.72);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  }
  .gg-lb-backdrop.show { display: flex; }
  .gg-lb-panel {
    width: min(92%, 400px); max-height: 80vh;
    display: flex; flex-direction: column; gap: 12px;
    background: rgba(15,15,25,0.96);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px; padding: 18px 14px 14px;
    box-shadow: 0 16px 40px rgba(0,0,0,0.55);
    color: #fff; font-family: inherit;
  }
  .gg-lb-head { display: flex; align-items: center; gap: 10px; }
  .gg-lb-head__icon { font-size: 24px; }
  .gg-lb-head__title { font-size: 11px; letter-spacing: 0.28em; text-transform: uppercase; color: rgba(255,255,255,0.55); }
  .gg-lb-head__game { font-size: 14px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; margin-top: 2px; }
  .gg-lb-close {
    width: 30px; height: 30px; border-radius: 50%;
    background: rgba(255,255,255,0.08); border: none; color: #fff;
    font-size: 13px; cursor: pointer; font-family: inherit;
    -webkit-tap-highlight-color: transparent;
  }
  .gg-lb-tabs { display: flex; gap: 6px; background: rgba(255,255,255,0.04); border-radius: 10px; padding: 4px; }
  .gg-lb-tab {
    flex: 1; padding: 8px 10px; border-radius: 8px; border: none;
    background: transparent; color: rgba(255,255,255,0.6);
    font-family: inherit; font-size: 12px; letter-spacing: 0.04em; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .gg-lb-tab.active { background: rgba(255,255,255,0.12); color: #fff; }
  .gg-lb-body { flex: 1; overflow-y: auto; min-height: 200px; -webkit-overflow-scrolling: touch; }
  .gg-lb-state { padding: 48px 12px; text-align: center; color: rgba(255,255,255,0.45); font-size: 13px; }

  .gg-lb-state--download { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; }
  .gg-lb-state__icon { font-size:34px; line-height:1; }
  .gg-lb-state__download { display:inline-flex; align-items:center; justify-content:center; min-height:40px; padding:0 16px; border-radius:999px; border:1px solid rgba(255,255,255,0.28); background:rgba(255,255,255,0.12); color:#fff; text-decoration:none; font-weight:700; letter-spacing:0; -webkit-tap-highlight-color:transparent; }
  .gg-lb-state__download:active { transform:scale(.97); background:rgba(255,255,255,0.18); }
  .gg-lb-row {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 10px; border-radius: 12px; margin-bottom: 4px;
    border: 1px solid transparent;
  }
  .gg-lb-row.top { background: rgba(255,255,255,0.04); }
  .gg-lb-row.me  { background: rgba(255,197,85,0.14); border-color: rgba(255,197,85,0.4); }
  .gg-lb-row.clickable { cursor: pointer; }
  .gg-lb-rank { width: 26px; text-align: center; font-weight: 700; font-size: 14px; color: rgba(255,255,255,0.45); }
  .gg-lb-rank.medal { font-size: 20px; }
  .gg-lb-av {
    background: rgba(255,255,255,0.08); border-radius: 50%; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; color: rgba(255,255,255,0.6); flex-shrink: 0;
  }
  .gg-lb-av img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .gg-lb-info { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; }
  .gg-lb-name { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 170px; }
  .gg-lb-mebadge { font-size: 10px; padding: 2px 6px; border-radius: 6px; background: rgba(255,197,85,0.28); color: var(--accent); }
  .gg-lb-score { font-weight: 700; font-size: 16px; color: #fff; font-variant-numeric: tabular-nums; }
</style>
    <script src="https://images.aiwaves.tech/alteru/guest-shell.js" defer></script>

<body>
  <canvas id="stage"></canvas>

  <div class="hud">
    <div class="label">Height</div>
    <div class="counter" id="counter">0</div>
    <div class="combo-row">
      <span class="combo" id="combo">×0</span>
      <span class="best">Best · <b id="best">0</b></span>
    </div>
    <div class="hint" id="hint">Tap to drop</div>
    <div class="perfect-banner" id="perfectBanner">Perfect!</div>
  </div>

  <div class="theme-dots" id="themeDots">
    <div class="dot active" data-t="prism"></div>
    <div class="dot" data-t="sunset"></div>
    <div class="dot" data-t="ocean"></div>
  </div>

  <div class="gg-lb-toggle">
    <button type="button" id="lbToggleBtn" aria-label="Leaderboard">🏆</button>
  </div>

  <div class="credits">Stack · Time the tap</div>

  <div class="gameover" id="gameover">
    <div class="gameover-title">Tower fell</div>
    <div class="gameover-score" id="goverScore">0</div>
    <div class="gameover-stats" id="goverStats">Best 0 · Top combo 0</div>
    <div class="gameover-row">
      <button class="gameover-btn" id="restartBtn">Play again</button>
      <button class="gameover-btn gameover-btn--ghost" id="goverLbBtn">🏆 Leaderboard</button>
    </div>
  </div>

<script>
// ====== Leaderboard module — sets window.GG_LB ======
(function () {
  'use strict';
  // Talks to Aigram platform via window.Aigram (see aigram-bridge.js).
  const GAME_ID   = 'stack';
  const GAME_NAME = 'STACK';

  const A = window.Aigram;
  const { telegramId, apiOrigin, isInAigram, gameUuid, callAigramAPI, openAigramProfile } = A;

  let currentUser = null;

  if (isInAigram && telegramId) {
    callAigramAPI(`/note/telegram/user/get/info/by/telegram_id?telegram_id=${telegramId}`)
      .then(res => { currentUser = (res && res.data) ? res.data : res; })
      .catch(() => {});
  }

  async function submitScore(score) {
    if (!A.canRank || !(score > 0)) return;
    try {
      await callAigramAPI(
        '/note/aigram/ai/game/rank/score/save',
        'POST',
        { session_id: gameUuid, score: Math.floor(score) }
      );
    } catch (_) {}
  }

  // ── Leaderboard-beat 1:1 notify (score_beat) — see aigram-notify skill ──
  let preRunBest = 0;
  const notifiedTargets = new Set();
  if (A.canRank && telegramId) {
    callAigramAPI('/note/aigram/ai/game/rank/score/list/by/session_id?session_id=' + gameUuid, 'GET')
      .then(res => {
        const rows = Array.isArray(res) ? res : (res && res.data) || [];
        const meId = String(telegramId);
        const me = rows.find(r => String(r.user_id) === meId);
        preRunBest = me ? Number(me.score) || 0 : 0;
      }).catch(() => {});
  }
  async function notifyBeat(myScore) {
    if (!A.canRank || !telegramId) return;
    if (myScore <= preRunBest) return;
    try {
      const res = await callAigramAPI(
        '/note/aigram/ai/game/rank/score/list/by/session_id?session_id=' + gameUuid, 'GET');
      const rows = Array.isArray(res) ? res : (res && res.data) || [];
      const meId = String(telegramId);
      const beaten = rows
        .filter(r => String(r.user_id) !== meId)
        .map(r => ({ id: String(r.user_id), score: Number(r.score) || 0 }))
        .filter(r => r.score < myScore && r.score > preRunBest && !notifiedTargets.has(r.id))
        .sort((a, b) => b.score - a.score)[0];
      if (!beaten) return;
      notifiedTargets.add(beaten.id);
      A.postAigramAPI('/note/aigram/ai/game/record/play', {
        session_id: gameUuid,
        event: 'score_beat',
        config_json: { actions: [{
          type: 'notify',
          target_user_id: beaten.id,
          image: {
            ref_url: 'https://yinxinghuan.github.io/games/posters/stack.png',
            prompt: 'A tall precarious tower of colourful blocks reaching toward a pastel sky.',
          },
          message: {
            template: '{sender_name} just out-stacked you — ' + Math.round(myScore) + ' on Stack.',
            variables: ['sender_name'],
          },
        }] },
      });
    } catch (_) {}
  }

  async function fetchGlobal() {
    if (!A.canRank) return [];
    try {
      const r = await callAigramAPI(
        `/note/aigram/ai/game/rank/score/list/by/session_id?session_id=${encodeURIComponent(gameUuid)}`
      );
      const rows = (r && Array.isArray(r.data)) ? r.data : (Array.isArray(r) ? r : []);
      return rows.map(row => ({
        telegram_id: String(row.user_id),
        name: row.user_name,
        avatar_url: row.head_url,
        score: Number(row.score),
        rank: row.rank,
        isMe: String(row.user_id) === String(telegramId),
      }));
    } catch (_) { return []; }
  }

  async function fetchFriends() { return []; }

  function openProfile(tid) { openAigramProfile(tid); }

  // ----- UI -----
  const ALTERU_APP_URL = 'https://apps.apple.com/app/id6769646546';
  const zh = (navigator.language || '').toLowerCase().startsWith('zh');
  const S = zh
    ? { title:'排行榜', global:'🌍 全局榜', friends:'👥 好友榜', me:'我',
        empty:'暂无记录，快来第一个上榜！', emptyFriends:'好友还未上榜，快来邀请他们！', loading:'加载中…', openInAlterU:'在 AlterU 中打开即可查看排行榜', downloadAlterU:'下载 AlterU' }
    : { title:'Leaderboard', global:'🌍 Global', friends:'👥 Friends', me:'me',
        empty:'No records yet. Be the first!', emptyFriends:'No friends on the board yet.', loading:'Loading…', openInAlterU:'Open in AlterU to view the leaderboard.', downloadAlterU:'Get AlterU on the App Store' };
  const MEDALS = ['🥇','🥈','🥉'];
  const MEDAL_COLORS = ['#FFD700','#C0C0C0','#CD7F32'];

  let root, body;
  const tabs = {};
  let currentTab = 'global';

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function build() {
    if (root) return;
    root = document.createElement('div');
    root.className = 'gg-lb-backdrop';
    root.addEventListener('pointerdown', e => { if (e.target === root) hide(); });

    const panel = document.createElement('div');
    panel.className = 'gg-lb-panel';
    root.appendChild(panel);

    const head = document.createElement('div');
    head.className = 'gg-lb-head';
    head.innerHTML =
      '<span class="gg-lb-head__icon">🏆</span>' +
      '<div style="flex:1; min-width:0">' +
        `<div class="gg-lb-head__title">${esc(S.title)}</div>` +
        `<div class="gg-lb-head__game">${esc(GAME_NAME)}</div>` +
      '</div>' +
      '<button type="button" class="gg-lb-close">✕</button>';
    panel.appendChild(head);
    head.querySelector('.gg-lb-close').addEventListener('pointerdown', hide);

    if (isInAigram) {
      const tabRow = document.createElement('div');
      tabRow.className = 'gg-lb-tabs';
      ['global'].forEach(key => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'gg-lb-tab' + (key === 'global' ? ' active' : '');
        b.textContent = key === 'global' ? S.global : S.friends;
        b.addEventListener('pointerdown', () => {
          if (currentTab !== key) { currentTab = key; updateTabs(); refresh(); }
        });
        tabRow.appendChild(b);
        tabs[key] = b;
      });
      panel.appendChild(tabRow);
    }

    body = document.createElement('div');
    body.className = 'gg-lb-body';
    panel.appendChild(body);

    document.body.appendChild(root);
  }

  function updateTabs() {
    Object.keys(tabs).forEach(k => tabs[k].classList.toggle('active', k === currentTab));
  }


  function renderDownload() {
    if (!body) return;
    body.innerHTML = '';
    const state = document.createElement('div');
    state.className = 'gg-lb-state gg-lb-state--download';
    const icon = document.createElement('span');
    icon.className = 'gg-lb-state__icon';
    icon.textContent = '🏆';
    const text = document.createElement('span');
    text.textContent = S.openInAlterU;
    const link = document.createElement('a');
    link.className = 'gg-lb-state__download';
    link.href = ALTERU_APP_URL;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    link.textContent = S.downloadAlterU;
    state.append(icon, text, link);
    body.appendChild(state);
  }

  function render(entries) {
    if (!body) return;
    body.innerHTML = '';
    if (!entries.length) {
      const empty = document.createElement('div');
      empty.className = 'gg-lb-state';
      empty.textContent = currentTab === 'friends' ? S.emptyFriends : S.empty;
      body.appendChild(empty);
      return;
    }
    entries.forEach((e, i) => {
      const row = document.createElement('div');
      const top = i < 3;
      row.className = 'gg-lb-row' + (top ? ' top' : '') + (e.isMe ? ' me' : '') + (isInAigram ? ' clickable' : '');
      if (isInAigram) row.addEventListener('click', () => openProfile(e.telegram_id));

      const rank = document.createElement('div');
      if (top) { rank.className = 'gg-lb-rank medal'; rank.textContent = MEDALS[i]; rank.style.color = MEDAL_COLORS[i]; }
      else     { rank.className = 'gg-lb-rank'; rank.textContent = String(i + 1); }
      row.appendChild(rank);

      const sz = top ? 40 : 34;
      const av = document.createElement('div');
      av.className = 'gg-lb-av';
      av.style.width = sz + 'px'; av.style.height = sz + 'px';
      av.style.fontSize = Math.round(sz * 0.4) + 'px';
      if (e.avatar_url) {
        const img = document.createElement('img');
        img.src = e.avatar_url; img.alt = e.name || ''; img.draggable = false;
        img.onerror = () => { av.innerHTML = ''; av.textContent = (e.name || '?').charAt(0).toUpperCase(); };
        av.appendChild(img);
      } else {
        av.textContent = (e.name || '?').charAt(0).toUpperCase();
      }
      row.appendChild(av);

      const info = document.createElement('div');
      info.className = 'gg-lb-info';
      info.innerHTML =
        `<span class="gg-lb-name">${esc(e.name || '')}</span>` +
        (e.isMe ? `<span class="gg-lb-mebadge">${esc(S.me)}</span>` : '');
      row.appendChild(info);

      const sc = document.createElement('span');
      sc.className = 'gg-lb-score';
      sc.textContent = Number(e.score || 0).toLocaleString('en-US');
      row.appendChild(sc);

      body.appendChild(row);
    });
  }

  async function refresh() {
    if (!isInAigram) { renderDownload(); return; }
    body.innerHTML = `<div class="gg-lb-state">${esc(S.loading)}</div>`;
    const data = currentTab === 'friends' ? await fetchFriends() : await fetchGlobal();
    render(data);
  }

  function show() {
    build();
    currentTab = 'global';
    updateTabs();
    root.classList.add('show');
    refresh();
  }
  function hide() { if (root) root.classList.remove('show'); }

  // Wire up the always-visible toggle button (synchronous — script is below the button in DOM)
  const tbtn = document.getElementById('lbToggleBtn');
  if (tbtn) tbtn.addEventListener('pointerdown', show);

  window.GG_LB = { isInAigram, submitScore, notifyBeat, show, hide };
})();
</script>

<script>
(() => {
  'use strict';

  // ----- Themes ---------------------------------------------------------------
  // Each block gets a hue that cycles smoothly as the tower grows. Themes
  // determine the hue band: prism = full rainbow, sunset = warm, ocean = cool.
  const THEMES = {
    prism: {
      bg: '#060716', accent: '#ffc555',
      hueBase: 0, hueSpread: 360, hueStep: 14,    // °/block
      ground: '#1a1d2e',
      root: 130.81,
    },
    sunset: {
      bg: '#150407', accent: '#ffb04a',
      hueBase: 350, hueSpread: 80, hueStep: 4,
      ground: '#241010',
      root: 174.61,
    },
    ocean: {
      bg: '#020a18', accent: '#7fd0ff',
      hueBase: 165, hueSpread: 130, hueStep: 6,
      ground: '#0e1a2d',
      root: 196.00,
    },
  };

  // ----- DOM + Canvas --------------------------------------------------------
  const canvas      = document.getElementById('stage');
  const ctx         = canvas.getContext('2d');
  const counterEl   = document.getElementById('counter');
  const comboEl     = document.getElementById('combo');
  const bestEl      = document.getElementById('best');
  const hintEl      = document.getElementById('hint');
  const perfectBan  = document.getElementById('perfectBanner');
  const dotsEl      = document.getElementById('themeDots');
  const gameoverEl  = document.getElementById('gameover');
  const goverScore  = document.getElementById('goverScore');
  const goverStats  = document.getElementById('goverStats');
  const restartBtn  = document.getElementById('restartBtn');
  const goverLbBtn  = document.getElementById('goverLbBtn');

  let W = 0, H = 0, DPR = 1, baseScale = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2.5);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width  = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    baseScale = Math.min(W, H) / 414;
  }
  resize();
  window.addEventListener('resize', resize);

  // ----- Constants ----------------------------------------------------------
  const BLOCK_H               = 36;            // block height
  const BLOCK_DEPTH           = 14;            // pseudo-3D depth offset (px)
  const INITIAL_BLOCK_W       = 240;           // starting candidate / ground width
  const CANDIDATE_VX_BASE     = 260;           // px/s
  const CANDIDATE_VX_GROWTH   = 3.2;           // per height added
  const CANDIDATE_VX_CAP      = 540;
  const PERFECT_TOLERANCE     = 7;             // px diff that counts as perfect
  const PERFECT_REGROWTH      = 9;             // px the block grows back on perfect
  const TOP_ANCHOR_FRAC       = 0.42;          // tower top sits at this screen y
  const CAMERA_LERP           = 9;             // smooth camera scroll
  const HUE_START             = 0;
  // Block drop animation: when placed, block starts -DROP_OFFSET y from final
  // and springs into place. Provides the "real drop" feel instead of teleport.
  const DROP_OFFSET           = 26;            // px above final position
  const DROP_SPRING_K         = 520;
  const DROP_SPRING_D         = 18;
  // Tower sway: whole tower offsets horizontally on each impact, springs back.
  const SWAY_SPRING_K         = 180;
  const SWAY_SPRING_D         = 11;

  // ----- State --------------------------------------------------------------
  let themeName = 'prism';
  let theme = THEMES[themeName];

  let state = newGame();
  function newGame() {
    const cx = W / 2;
    const start = {
      x: cx - INITIAL_BLOCK_W / 2,
      width: INITIAL_BLOCK_W,
      height: BLOCK_H,
      hue: theme.hueBase % 360,
    };
    return {
      blocks: [start],                 // index 0 = ground
      candidate: null,
      direction: 1,                    // +1 → moves right, -1 → moves left
      cameraOffset: 0,                 // smooth scroll (px). Lerps to 0 after each drop.
      combo: 0,
      best: parseInt(localStorage.getItem('stack.best') || '0', 10) || 0,
      bestCombo: parseInt(localStorage.getItem('stack.bestCombo') || '0', 10) || 0,
      gameOver: false,
      sparks: [],                      // perfect-drop sparkles
      pulses: [],                      // radial expanding rings on perfect
      floatTexts: [],                  // "+N" floating bonus texts
      flashAlpha: 0,                   // 1-frame screen flash on perfect
      chunks: [],                      // falling overhang pieces
      ambient: [],                     // background drifting motes
      towerSway: { x: 0, vx: 0 },      // horizontal impact sway (springs to 0)
      shake: 0,
      interacted: false,
    };
  }
  bestEl.textContent = state.best.toLocaleString('en-US');
  spawnCandidate();

  function score() { return state.blocks.length - 1; }   // ground doesn't count

  // ----- Ambient background motes -------------------------------------------
  function spawnAmbient() {
    return {
      x: Math.random() * W,
      y: Math.random() * H,
      r: (0.6 + Math.random() * 1.6) * baseScale,
      vy: -(8 + Math.random() * 18),         // drift slowly upward
      vx: (Math.random() - 0.5) * 6,
      alpha: 0.2 + Math.random() * 0.4,
      hueShift: (Math.random() - 0.5) * 80,  // small variation around theme accent
    };
  }
  for (let i = 0; i < 60; i++) {
    const m = spawnAmbient();
    m.y = Math.random() * H;                  // start scattered everywhere
    state.ambient.push(m);
  }

  // ----- Candidate generation -----------------------------------------------
  function spawnCandidate() {
    if (state.gameOver) return;
    const prev = state.blocks[state.blocks.length - 1];
    const speed = Math.min(CANDIDATE_VX_CAP, CANDIDATE_VX_BASE + score() * CANDIDATE_VX_GROWTH);
    const hue = (theme.hueBase + ((state.blocks.length) * theme.hueStep)) % 360;
    state.direction = -state.direction || 1;
    // Spawn from the side, off-screen
    const fromLeft = state.direction > 0;
    const x = fromLeft ? -prev.width - 10 : W + 10;
    state.candidate = {
      x,
      width: prev.width,
      height: BLOCK_H,
      hue,
      vx: speed * (fromLeft ? 1 : -1),
    };
  }

  // ----- Drop logic ---------------------------------------------------------
  function tryDrop() {
    if (state.gameOver || !state.candidate) return;
    const c = state.candidate;
    const prev = state.blocks[state.blocks.length - 1];
    const overlapStart = Math.max(prev.x, c.x);
    const overlapEnd   = Math.min(prev.x + prev.width, c.x + c.width);
    const overlap      = overlapEnd - overlapStart;

    if (overlap <= 0) {
      // Total miss — the block falls into the abyss
      state.chunks.push({
        x: c.x, w: c.width, y: 0, vy: 0, vx: c.vx * 0.4, rot: 0, vr: (Math.random() - 0.5) * 6,
        hue: c.hue, life: 1.4, maxLife: 1,
      });
      audio.die();
      state.shake = 14;
      state.gameOver = true;
      const finalScore = score();
      goverScore.textContent = finalScore.toLocaleString('en-US');
      goverStats.textContent = `Best ${state.best.toLocaleString('en-US')} · Top combo ${state.bestCombo}`;
      if (window.GG_LB) { window.GG_LB.submitScore(finalScore); window.GG_LB.notifyBeat && window.GG_LB.notifyBeat(finalScore); }
      setTimeout(() => gameoverEl.classList.add('show'), 900);
      return;
    }

    const offset = Math.abs(prev.x - c.x);
    const isPerfect = offset < PERFECT_TOLERANCE;
    let placed;
    if (isPerfect) {
      // Perfect: snap to previous block's x; WIDTH REGROWS toward original
      // (classic Stack reward — you can recover from a thin tower with a
      // streak of perfects). Combo bonus on top.
      const grown = Math.min(prev.width + PERFECT_REGROWTH, INITIAL_BLOCK_W);
      placed = {
        x: prev.x - (grown - prev.width) / 2,        // grow symmetrically
        width: grown,
        height: BLOCK_H,
        hue: c.hue,
      };
      // Clamp inside screen
      if (placed.x < 0) placed.x = 0;
      if (placed.x + placed.width > W) placed.x = W - placed.width;
      state.combo++;
      audio.perfect(state.combo);
      spawnPerfectSparks(placed);
      spawnRadialPulse(placed);
      perfectBan.classList.add('flash');
      setTimeout(() => perfectBan.classList.remove('flash'), 450);
      state.shake = 5;
      // Floating "+N" with combo bonus text
      const bonus = 1 + state.combo;
      state.floatTexts.push({
        text: `+${bonus}`,
        x: placed.x + placed.width / 2,
        screenYOffset: 0,
        life: 1.0,
        maxLife: 1.0,
        hue: placed.hue,
        big: true,
      });
      // Screen flash overlay (1 frame)
      state.flashAlpha = 0.35;
    } else {
      placed = { x: overlapStart, width: overlap, height: BLOCK_H, hue: c.hue };
      // Falling chunks for the trimmed portion(s)
      if (c.x < placed.x) {
        // left overhang
        state.chunks.push({
          x: c.x, w: placed.x - c.x, y: 0, vy: 0, vx: -120 - Math.random() * 60,
          rot: 0, vr: -2 - Math.random() * 3,
          hue: c.hue, life: 1.4, maxLife: 1,
        });
      }
      if (c.x + c.width > placed.x + placed.width) {
        // right overhang
        state.chunks.push({
          x: placed.x + placed.width, w: (c.x + c.width) - (placed.x + placed.width),
          y: 0, vy: 0, vx: 120 + Math.random() * 60,
          rot: 0, vr: 2 + Math.random() * 3,
          hue: c.hue, life: 1.4, maxLife: 1,
        });
      }
      if (state.combo > 0) audio.comboBreak();
      state.combo = 0;
      audio.drop();
      state.shake = 5;
    }
    if (state.combo > state.bestCombo) {
      state.bestCombo = state.combo;
      localStorage.setItem('stack.bestCombo', String(state.bestCombo));
    }

    // Drop animation: new block starts above its final spot and springs in
    placed.dropOffset = -DROP_OFFSET;
    placed.dropVy = 0;

    // Tower sway: kick away from the impact. Direction = sign of offset
    // (where the candidate landed relative to the previous top). Perfect drops
    // give a mild kick in the candidate's travel direction.
    const swayDir = isPerfect ? Math.sign(c.vx) : Math.sign(c.x - prev.x);
    const swayMag = isPerfect ? 80 : 160;
    state.towerSway.vx += swayDir * swayMag;

    state.blocks.push(placed);
    counterEl.textContent = score().toString();
    counterEl.classList.add('burst');
    setTimeout(() => counterEl.classList.remove('burst'), 130);
    comboEl.textContent = '×' + state.combo;
    comboEl.classList.toggle('big', state.combo >= 5);

    if (score() > state.best) {
      state.best = score();
      bestEl.textContent = state.best.toLocaleString('en-US');
      localStorage.setItem('stack.best', String(state.best));
    }

    // Glass-shatter milestones on combo
    if (state.combo === 5)       audio.glassBreak(0.7);
    else if (state.combo === 10) audio.glassBreak(1.1);
    else if (state.combo === 20) audio.glassBreak(1.6);
    else if (state.combo > 20 && state.combo % 10 === 0) audio.glassBreak(1.8);

    // Camera shift up by one block (smoothly scroll down: positive offset
    // means visually shift everything up; lerps back to 0)
    state.cameraOffset = BLOCK_H;
    spawnCandidate();
  }

  function spawnPerfectSparks(placed) {
    const hue = placed.hue;
    const n = 48;                                 // much more particles
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const spd = (180 + Math.random() * 280) * baseScale;
      state.sparks.push({
        x: placed.x + Math.random() * placed.width,
        screenYOffset: 0,
        vx: Math.cos(a) * spd,
        vy: Math.sin(a) * spd - 120,
        life: 0.55 + Math.random() * 0.65,
        maxLife: 1,
        size: (1.8 + Math.random() * 2.4) * baseScale,
        hue,
      });
    }
  }
  function spawnRadialPulse(placed) {
    state.pulses.push({
      x: placed.x + placed.width / 2,
      screenYOffset: 0,
      r: 0,
      maxR: Math.max(W * 0.55, placed.width * 1.6),
      life: 0.45, maxLife: 0.45,
      hue: placed.hue,
    });
  }

  // ----- Input ---------------------------------------------------------------
  canvas.addEventListener('pointerdown', () => {
    if (state.gameOver) return;
    if (!state.interacted) {
      state.interacted = true;
      audio.unlock();
      hintEl.classList.add('hidden');
    }
    tryDrop();
  });

  // Theme dots
  dotsEl.addEventListener('pointerdown', (e) => {
    const t = e.target.closest('.dot');
    if (!t) return;
    const name = t.dataset.t;
    if (!THEMES[name] || name === themeName) return;
    themeName = name;
    theme = THEMES[name];
    document.body.style.background = theme.bg;
    document.documentElement.style.setProperty('--bg', theme.bg);
    document.documentElement.style.setProperty('--accent', theme.accent);
    [...dotsEl.children].forEach(d => d.classList.toggle('active', d.dataset.t === name));
    audio.onThemeChange();
    // Reskin existing blocks to the new palette
    state.blocks.forEach((b, i) => {
      b.hue = (theme.hueBase + i * theme.hueStep) % 360;
    });
    if (state.candidate) {
      state.candidate.hue = (theme.hueBase + state.blocks.length * theme.hueStep) % 360;
    }
  });

  if (goverLbBtn) {
    goverLbBtn.addEventListener('pointerdown', () => {
      if (window.GG_LB) window.GG_LB.show();
    });
  }

  restartBtn.addEventListener('pointerdown', () => {
    gameoverEl.classList.remove('show');
    const oldBest = state.best;
    const oldBestCombo = state.bestCombo;
    state = newGame();
    state.best = oldBest;
    state.bestCombo = oldBestCombo;
    state.interacted = true;
    counterEl.textContent = '0';
    comboEl.textContent = '×0';
    comboEl.classList.remove('big');
    spawnCandidate();
  });

  // ----- Audio --------------------------------------------------------------
  // Tribal style: percussion-driven loop (kick + tom + shaker + conga rim).
  // No melody — each player tap is a drum hit on top of the loop. The first
  // 3 games used synthwave / cosmic-ambient / lo-fi; tribal is a clearly
  // distinct sonic palette.
  const audio = (() => {
    let ac = null;
    let masterGain, bgmGain, fxGain;
    let delayNode, delayFb, delayWet;
    let unlocked = false;
    let bgmStarted = false;
    let stepIdx = 0, nextStepT = 0;
    let lastTapT = 0;

    const BPM = 96;
    const SIXTEENTH = 60 / BPM / 4;
    const LOOP_STEPS = 16 * 2;             // 2-bar loop

    function ensure() {
      if (ac) return ac;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ac = new AC();
      masterGain = ac.createGain(); masterGain.gain.value = 0.8; masterGain.connect(ac.destination);
      delayNode = ac.createDelay(0.6);
      delayNode.delayTime.value = SIXTEENTH * 3;
      delayFb  = ac.createGain(); delayFb.gain.value = 0.36;
      delayWet = ac.createGain(); delayWet.gain.value = 0.26;
      delayNode.connect(delayFb); delayFb.connect(delayNode);
      delayNode.connect(delayWet); delayWet.connect(masterGain);
      bgmGain = ac.createGain(); bgmGain.gain.value = 0; bgmGain.connect(masterGain);
      fxGain  = ac.createGain(); fxGain.gain.value = 1; fxGain.connect(masterGain);
      return ac;
    }
    function unlock() {
      if (unlocked) return;
      if (!ensure()) return;
      if (ac.state !== 'running') ac.resume();
      unlocked = true;
      setTimeout(() => {
        if (!unlocked) return;
        const t = ac.currentTime;
        bgmGain.gain.setValueAtTime(0, t);
        bgmGain.gain.linearRampToValueAtTime(0.50, t + 1.5);
        nextStepT = t + 0.1;
        stepIdx = 0;
        bgmStarted = true;
        scheduler();
      }, 300);
    }
    function onThemeChange() {
      if (!ac || !unlocked) return;
      const t = ac.currentTime;
      bgmGain.gain.cancelScheduledValues(t);
      bgmGain.gain.setValueAtTime(bgmGain.gain.value, t);
      bgmGain.gain.linearRampToValueAtTime(0.12, t + 0.2);
      bgmGain.gain.linearRampToValueAtTime(0.50, t + 1.0);
    }

    // ----- Percussion voices ----------------------------------------------
    function kick(t, vel = 0.65, freqStart = 130) {
      const o = ac.createOscillator(); o.type = 'sine';
      o.frequency.setValueAtTime(freqStart, t);
      o.frequency.exponentialRampToValueAtTime(45, t + 0.10);
      const g = ac.createGain();
      g.gain.setValueAtTime(vel, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.20);
      o.connect(g); g.connect(bgmGain);
      o.start(t); o.stop(t + 0.24);
    }
    function tom(t, freq, vel = 0.35) {
      const o = ac.createOscillator(); o.type = 'sine';
      o.frequency.setValueAtTime(freq, t);
      o.frequency.exponentialRampToValueAtTime(freq * 0.5, t + 0.18);
      const g = ac.createGain();
      g.gain.setValueAtTime(vel, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
      // body noise
      const len = Math.floor(ac.sampleRate * 0.06);
      const buf = ac.createBuffer(1, len, ac.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = (Math.random() - 0.5) * 2 * (1 - i / len);
      const ns = ac.createBufferSource(); ns.buffer = buf;
      const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = freq * 2; bp.Q.value = 1.5;
      const ng = ac.createGain(); ng.gain.value = vel * 0.4;
      o.connect(g); g.connect(bgmGain);
      ns.connect(bp); bp.connect(ng); ng.connect(bgmGain);
      o.start(t); o.stop(t + 0.26); ns.start(t);
    }
    function shaker(t, vel = 0.12) {
      const len = Math.floor(ac.sampleRate * 0.05);
      const buf = ac.createBuffer(1, len, ac.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < len; i++) {
        const env = Math.pow(1 - i / len, 1.8);
        data[i] = (Math.random() - 0.5) * 2 * env;
      }
      const ns = ac.createBufferSource(); ns.buffer = buf;
      const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 5500;
      const g = ac.createGain(); g.gain.value = vel;
      ns.connect(hp); hp.connect(g); g.connect(bgmGain);
      ns.start(t);
    }
    function congaRim(t, vel = 0.20) {
      const o = ac.createOscillator(); o.type = 'triangle';
      o.frequency.setValueAtTime(400, t);
      o.frequency.exponentialRampToValueAtTime(180, t + 0.06);
      const g = ac.createGain();
      g.gain.setValueAtTime(vel, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
      const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1200; bp.Q.value = 2;
      o.connect(bp); bp.connect(g); g.connect(bgmGain);
      o.start(t); o.stop(t + 0.12);
    }
    function dronePulse(t) {
      // Subtle sub-bass drone every 2 bars
      const o = ac.createOscillator(); o.type = 'sine';
      o.frequency.value = theme.root * 0.25;
      const g = ac.createGain();
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.10, t + 0.4);
      g.gain.linearRampToValueAtTime(0.06, t + 2.0);
      g.gain.linearRampToValueAtTime(0, t + 3.0);
      o.connect(g); g.connect(bgmGain);
      o.start(t); o.stop(t + 3.2);
    }

    function scheduleStep(stepGlobal, t) {
      const step = stepGlobal % LOOP_STEPS;
      const stepInBar = step % 16;
      const barIdx = Math.floor(step / 16);
      // Tribal pattern: kick on 1 & 9 (half-time), toms 5 & 13, shaker on 8ths,
      // conga rim on the "and" of 2 (= step 6) every bar
      if (stepInBar === 0)  kick(t, 0.72);
      if (stepInBar === 8)  kick(t, 0.55);
      if (stepInBar === 4)  tom(t, theme.root * 1.6, 0.32);
      if (stepInBar === 12) tom(t, theme.root * 1.2, 0.36);
      if (stepInBar === 6)  congaRim(t, 0.22);
      if (stepInBar === 14) congaRim(t, 0.18);
      if (stepInBar % 2 === 0) shaker(t, stepInBar % 4 === 0 ? 0.10 : 0.07);
      // Drone every 2 bars (start of bar 0)
      if (step === 0) dronePulse(t);
    }
    function scheduler() {
      if (!bgmStarted || !ac) return;
      while (nextStepT < ac.currentTime + 0.25) {
        scheduleStep(stepIdx, nextStepT);
        stepIdx++;
        nextStepT += SIXTEENTH;
      }
      setTimeout(scheduler, 30);
    }

    // ----- Event sounds ----------------------------------------------------
    function drop() {
      // Imperfect drop: low thunk + wood-tom layered
      if (!unlocked) return;
      const now = performance.now();
      if (now - lastTapT < 30) return;
      lastTapT = now;
      const t = ac.currentTime;
      kick(t, 0.55, 95);
      tom(t, 240, 0.28);
    }
    function perfect(combo) {
      // Perfect drop: bright tom chord + clap-ish snap. Pitch climbs combo.
      if (!unlocked) return;
      const t = ac.currentTime;
      const PENTA = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21];
      const stepSemi = PENTA[Math.min(combo - 1, PENTA.length - 1)];
      const freq = theme.root * 2 * Math.pow(2, stepSemi / 12);
      // Two-note chord
      const notes = [freq, freq * 1.4983];
      notes.forEach((f, i) => {
        const o = ac.createOscillator(); o.type = 'triangle'; o.frequency.value = f;
        const o2 = ac.createOscillator(); o2.type = 'sine'; o2.frequency.value = f * 2;
        const g = ac.createGain();
        const peak = 0.13 - i * 0.03;
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(peak, t + 0.004);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.32);
        o.connect(g); o2.connect(g); g.connect(fxGain);
        if (combo >= 2) g.connect(delayNode);
        o.start(t); o2.start(t);
        o.stop(t + 0.4); o2.stop(t + 0.4);
      });
      // Clap-snap
      const len = Math.floor(ac.sampleRate * 0.08);
      const buf = ac.createBuffer(1, len, ac.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < len; i++) {
        const env = Math.pow(1 - i / len, 2.4);
        data[i] = (Math.random() - 0.5) * 2 * env;
      }
      const ns = ac.createBufferSource(); ns.buffer = buf;
      const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1800; bp.Q.value = 2;
      const cg = ac.createGain(); cg.gain.value = 0.22;
      ns.connect(bp); bp.connect(cg); cg.connect(fxGain);
      ns.start(t);
    }
    function comboBreak() {
      if (!unlocked) return;
      const t = ac.currentTime;
      const o = ac.createOscillator(); o.type = 'sawtooth';
      o.frequency.setValueAtTime(theme.root * 0.5, t);
      o.frequency.exponentialRampToValueAtTime(theme.root * 0.25, t + 0.18);
      const g = ac.createGain();
      g.gain.setValueAtTime(0.08, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
      o.connect(g); g.connect(fxGain);
      o.start(t); o.stop(t + 0.26);
    }
    function die() {
      if (!unlocked) return;
      const t = ac.currentTime;
      const notes = [theme.root * 0.5, theme.root * 0.5 * 1.122, theme.root * 0.25];
      notes.forEach((f) => {
        const o = ac.createOscillator(); o.type = 'sawtooth';
        o.frequency.setValueAtTime(f, t);
        o.frequency.exponentialRampToValueAtTime(f * 0.5, t + 0.6);
        const lp = ac.createBiquadFilter(); lp.type = 'lowpass';
        lp.frequency.setValueAtTime(800, t);
        lp.frequency.exponentialRampToValueAtTime(300, t + 0.5);
        const g = ac.createGain();
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(0.15, t + 0.01);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.9);
        o.connect(lp); lp.connect(g); g.connect(fxGain); g.connect(delayNode);
        o.start(t); o.stop(t + 1.0);
      });
      // sub-impact
      const sub = ac.createOscillator(); sub.type = 'sine';
      sub.frequency.setValueAtTime(120, t);
      sub.frequency.exponentialRampToValueAtTime(35, t + 0.7);
      const subG = ac.createGain();
      subG.gain.setValueAtTime(0.30, t);
      subG.gain.exponentialRampToValueAtTime(0.001, t + 0.8);
      sub.connect(subG); subG.connect(fxGain);
      sub.start(t); sub.stop(t + 0.9);
    }
    function glassBreak(intensity = 1) {
      if (!unlocked) return;
      const t = ac.currentTime;
      const shards = 5 + Math.floor(intensity * 5);
      for (let i = 0; i < shards; i++) {
        const delay = Math.random() * 0.13;
        const baseF = 2400 + Math.random() * 4800;
        const o = ac.createOscillator();
        o.type = i % 2 === 0 ? 'sine' : 'triangle';
        o.frequency.setValueAtTime(baseF, t + delay);
        o.frequency.exponentialRampToValueAtTime(baseF * 0.42, t + delay + 0.16);
        const g = ac.createGain();
        const peak = (0.045 + Math.random() * 0.035) * intensity;
        g.gain.setValueAtTime(0, t + delay);
        g.gain.linearRampToValueAtTime(peak, t + delay + 0.003);
        g.gain.exponentialRampToValueAtTime(0.001, t + delay + 0.20);
        o.connect(g); g.connect(fxGain);
        if (i < 3) g.connect(delayNode);
        o.start(t + delay); o.stop(t + delay + 0.24);
      }
    }

    return { unlock, drop, perfect, comboBreak, die, glassBreak, onThemeChange };
  })();

  // ----- Update + render -----------------------------------------------------
  function update(dt) {
    // Camera ease
    state.cameraOffset += (0 - state.cameraOffset) * Math.min(1, CAMERA_LERP * dt);
    if (state.shake > 0) state.shake = Math.max(0, state.shake - 22 * dt);

    // Tower sway: damped spring toward 0
    {
      const a = -SWAY_SPRING_K * state.towerSway.x - SWAY_SPRING_D * state.towerSway.vx;
      state.towerSway.vx += a * dt;
      state.towerSway.x  += state.towerSway.vx * dt;
      // Snap to rest below threshold
      if (Math.abs(state.towerSway.x) < 0.2 && Math.abs(state.towerSway.vx) < 4) {
        state.towerSway.x = 0; state.towerSway.vx = 0;
      }
    }

    // Per-block drop-in spring (only the most recently placed has non-zero offset)
    for (const b of state.blocks) {
      if (b.dropOffset == null || b.dropOffset === 0) continue;
      const a = -DROP_SPRING_K * b.dropOffset - DROP_SPRING_D * b.dropVy;
      b.dropVy += a * dt;
      b.dropOffset += b.dropVy * dt;
      if (Math.abs(b.dropOffset) < 0.3 && Math.abs(b.dropVy) < 5) {
        b.dropOffset = 0; b.dropVy = 0;
      }
    }

    // Candidate motion
    if (state.candidate && !state.gameOver) {
      const c = state.candidate;
      c.x += c.vx * dt;
      // Reverse at the edges (allow some off-screen room)
      const margin = c.width * 0.4;
      if (c.x < -margin)         { c.x = -margin;         c.vx = Math.abs(c.vx); }
      if (c.x + c.width > W + margin) { c.x = W + margin - c.width; c.vx = -Math.abs(c.vx); }
    }

    // Falling chunks
    for (let i = state.chunks.length - 1; i >= 0; i--) {
      const ch = state.chunks[i];
      ch.vy += 1600 * dt;
      ch.y += ch.vy * dt;
      ch.x += ch.vx * dt;
      ch.rot += ch.vr * dt;
      ch.life -= dt;
      if (ch.life <= 0) state.chunks.splice(i, 1);
    }
    // Sparks
    for (let i = state.sparks.length - 1; i >= 0; i--) {
      const s = state.sparks[i];
      s.x += s.vx * dt;
      s.screenYOffset += s.vy * dt;
      s.vy += 320 * dt;
      const decay = Math.pow(0.92, dt * 60);
      s.vx *= decay;
      s.life -= dt;
      if (s.life <= 0) state.sparks.splice(i, 1);
    }
    // Radial pulses
    for (let i = state.pulses.length - 1; i >= 0; i--) {
      const p = state.pulses[i];
      p.life -= dt;
      p.r = p.maxR * (1 - p.life / p.maxLife);
      if (p.life <= 0) state.pulses.splice(i, 1);
    }
    // Floating "+N" texts
    for (let i = state.floatTexts.length - 1; i >= 0; i--) {
      const f = state.floatTexts[i];
      f.screenYOffset -= (f.big ? 70 : 50) * dt;
      f.life -= dt;
      if (f.life <= 0) state.floatTexts.splice(i, 1);
    }
    // Screen flash decay
    if (state.flashAlpha > 0) state.flashAlpha = Math.max(0, state.flashAlpha - 2.0 * dt);

    // Ambient motes: drift, recycle when off-screen
    for (const m of state.ambient) {
      m.y += m.vy * dt;
      m.x += m.vx * dt;
      if (m.y < -10 || m.x < -10 || m.x > W + 10) {
        // recycle: respawn at bottom
        m.x = Math.random() * W;
        m.y = H + Math.random() * 40;
        m.vy = -(8 + Math.random() * 18);
        m.vx = (Math.random() - 0.5) * 6;
        m.r = (0.6 + Math.random() * 1.6) * baseScale;
        m.alpha = 0.2 + Math.random() * 0.4;
      }
    }
  }

  function fillBackground() {
    ctx.fillStyle = theme.bg;
    ctx.fillRect(0, 0, W, H);
    // Radial gradient — lighter near center-top, dark vignette at edges
    const cx = W / 2, cy = H * 0.4;
    const rg = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.85);
    rg.addColorStop(0, 'rgba(255,255,255,0.05)');
    rg.addColorStop(0.6, 'rgba(0,0,0,0)');
    rg.addColorStop(1, 'rgba(0,0,0,0.55)');
    ctx.fillStyle = rg;
    ctx.fillRect(0, 0, W, H);
    // Subtle horizon line where the tower visually "stands"
    const horizonY = topAnchorY() + BLOCK_H * 1.5;
    const lg = ctx.createLinearGradient(0, horizonY - 60, 0, horizonY + 60);
    lg.addColorStop(0, 'rgba(255,255,255,0)');
    lg.addColorStop(0.5, 'rgba(255,255,255,0.025)');
    lg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = lg;
    ctx.fillRect(0, horizonY - 60, W, 120);
  }

  function drawAmbient() {
    const accentHue = getAccentHue();
    for (const m of state.ambient) {
      ctx.globalAlpha = m.alpha;
      ctx.fillStyle = `hsl(${(accentHue + m.hueShift + 360) % 360}, 70%, 75%)`;
      ctx.beginPath();
      ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  function getAccentHue() {
    // Parse theme.accent as hex and approx HSL hue. Quick + cheap.
    const hex = theme.accent.replace('#', '');
    const r = parseInt(hex.slice(0, 2), 16) / 255;
    const g = parseInt(hex.slice(2, 4), 16) / 255;
    const b = parseInt(hex.slice(4, 6), 16) / 255;
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
    let h = 0;
    if (mx !== mn) {
      const d = mx - mn;
      switch (mx) {
        case r: h = ((g - b) / d) % 6; break;
        case g: h = (b - r) / d + 2; break;
        case b: h = (r - g) / d + 4; break;
      }
      h *= 60; if (h < 0) h += 360;
    }
    return h;
  }

  function topAnchorY() { return H * TOP_ANCHOR_FRAC; }

  // Block i sits in the tower at index i (0 = ground). Its TOP edge screen y:
  //   topY = topAnchorY() + (lastIndex - i) * BLOCK_H - cameraOffset
  // The most-recently placed block has lastIndex; its topY = anchor - offset.
  // The candidate sits just above the top block.
  function blockTopY(i) {
    const last = state.blocks.length - 1;
    return topAnchorY() + (last - i) * BLOCK_H - state.cameraOffset;
  }
  function candidateTopY() {
    return topAnchorY() - BLOCK_H - state.cameraOffset;
  }

  // Pseudo-3D block — 3 faces (front / top / right) with gradient shading,
  // soft drop shadow, and subtle gloss highlight along the top-front edge.
  function drawBlock(b, topY, alpha = 1) {
    const hue = b.hue;
    const lightColor = `hsl(${hue}, 82%, 65%)`;
    const midColor   = `hsl(${hue}, 78%, 50%)`;
    const midColor2  = `hsl(${hue}, 78%, 42%)`;
    const darkColor  = `hsl(${hue}, 78%, 30%)`;
    const glossColor = `hsla(${hue}, 95%, 85%, 0.65)`;
    const d = BLOCK_DEPTH * baseScale;

    ctx.globalAlpha = alpha;

    // Soft drop shadow underneath
    ctx.shadowColor = 'rgba(0,0,0,0.45)';
    ctx.shadowBlur  = 14 * baseScale;
    ctx.shadowOffsetX = 0;
    ctx.shadowOffsetY = 8 * baseScale;
    ctx.fillStyle = 'rgba(0,0,0,0.0001)';  // shadow needs a fill to render
    ctx.fillRect(b.x + 6, topY + BLOCK_H - 4, b.width - 12, 4);
    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0;
    ctx.shadowOffsetX = 0;
    ctx.shadowOffsetY = 0;

    // Right side face (parallelogram going back-up-right)
    ctx.fillStyle = darkColor;
    ctx.beginPath();
    ctx.moveTo(b.x + b.width, topY);
    ctx.lineTo(b.x + b.width + d, topY - d);
    ctx.lineTo(b.x + b.width + d, topY + BLOCK_H - d);
    ctx.lineTo(b.x + b.width, topY + BLOCK_H);
    ctx.closePath();
    ctx.fill();

    // Front face with vertical gradient (top brighter, bottom slightly darker)
    const grad = ctx.createLinearGradient(0, topY, 0, topY + BLOCK_H);
    grad.addColorStop(0, midColor);
    grad.addColorStop(1, midColor2);
    ctx.fillStyle = grad;
    ctx.fillRect(b.x, topY, b.width, BLOCK_H);

    // Top face (parallelogram going back-up)
    ctx.fillStyle = lightColor;
    ctx.beginPath();
    ctx.moveTo(b.x, topY);
    ctx.lineTo(b.x + d, topY - d);
    ctx.lineTo(b.x + b.width + d, topY - d);
    ctx.lineTo(b.x + b.width, topY);
    ctx.closePath();
    ctx.fill();

    // Gloss highlight: 1.5px bright strip along the top-front edge
    ctx.fillStyle = glossColor;
    ctx.fillRect(b.x, topY, b.width, 1.5 * baseScale);

    // Subtle inner shadow on the right (below the side face) for depth
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.fillRect(b.x + b.width - 3, topY, 3, BLOCK_H);

    ctx.globalAlpha = 1;
  }

  function getVisibleBlocks() {
    const lastIdx = state.blocks.length - 1;
    const visible = [];
    for (let i = lastIdx; i >= 0; i--) {
      const topY = blockTopY(i);
      if (topY > H + BLOCK_H + BLOCK_DEPTH) break;
      visible.push({ b: state.blocks[i], topY, i });
    }
    return { visible, lastIdx };
  }

  function drawTower() {
    const { visible, lastIdx } = getVisibleBlocks();
    // Apply horizontal tower-sway offset for the whole tower
    ctx.save();
    ctx.translate(state.towerSway.x, 0);
    // Draw in reverse order (oldest first, top of stack last) so 3D faces overlap right
    for (let k = visible.length - 1; k >= 0; k--) {
      const { b, topY, i } = visible[k];
      const depthBelow = (lastIdx - i);
      const fadeAlpha = Math.max(0.45, 1 - depthBelow * 0.038);
      const off = b.dropOffset || 0;
      drawBlock(b, topY + off, fadeAlpha);
    }
    ctx.restore();
  }

  // Mirrored copy of the tower below the lowest visible block. Adds a subtle
  // "showcase pedestal" feel without obscuring the play area.
  function drawReflection() {
    const { visible } = getVisibleBlocks();
    if (visible.length === 0) return;
    // Reflection origin = bottom of the lowest visible block
    const bottomVisible = visible[0];      // visible is collected top→bottom by Y; reverse?
    // visible array: pushed as we iterate i from lastIdx down, so first element is TOP, last is BOTTOM
    const lowest = visible[visible.length - 1];
    const reflLine = lowest.topY + BLOCK_H;
    if (reflLine > H) return;              // line off-screen: skip

    ctx.save();
    // Clip to area below reflection line
    ctx.beginPath();
    ctx.rect(0, reflLine, W, H - reflLine);
    ctx.clip();
    // Flip vertically about reflLine, plus tower-sway shift
    ctx.translate(state.towerSway.x, 2 * reflLine);
    ctx.scale(1, -1);

    for (let k = visible.length - 1; k >= 0; k--) {
      const { b, topY, i } = visible[k];
      const depthBelow = (state.blocks.length - 1 - i);
      const fadeAlpha = Math.max(0.45, 1 - depthBelow * 0.038);
      const off = b.dropOffset || 0;
      drawBlock(b, topY + off, fadeAlpha * 0.22);
    }
    ctx.restore();

    // Vertical fade-to-black gradient over the reflection area for natural falloff
    const grad = ctx.createLinearGradient(0, reflLine, 0, H);
    grad.addColorStop(0, 'rgba(0,0,0,0.15)');
    grad.addColorStop(1, 'rgba(0,0,0,1)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, reflLine, W, H - reflLine);
  }
  function drawCandidate() {
    if (!state.candidate || state.gameOver) return;
    const c = state.candidate;
    const topY = candidateTopY();
    drawBlock(c, topY);
  }
  function drawChunks() {
    for (const ch of state.chunks) {
      const a = Math.max(0, ch.life / ch.maxLife);
      const screenY = candidateTopY() + ch.y;
      ctx.save();
      ctx.globalAlpha = a;
      ctx.translate(ch.x + ch.w / 2, screenY + BLOCK_H / 2);
      ctx.rotate(ch.rot);
      ctx.fillStyle = `hsl(${ch.hue}, 78%, 50%)`;
      ctx.fillRect(-ch.w / 2, -BLOCK_H / 2, ch.w, BLOCK_H);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }
  function drawSparks() {
    for (const s of state.sparks) {
      const a = Math.max(0, s.life / s.maxLife);
      const screenY = candidateTopY() + BLOCK_H * 0.5 + s.screenYOffset;
      ctx.globalAlpha = a;
      ctx.fillStyle = `hsl(${s.hue}, 92%, 65%)`;
      ctx.shadowColor = `hsla(${s.hue}, 92%, 70%, 0.6)`;
      ctx.shadowBlur = 8 * baseScale;
      ctx.beginPath();
      ctx.arc(s.x, screenY, s.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
  }

  function drawPulses() {
    // Radial expanding rings from the perfect-drop point
    for (const p of state.pulses) {
      const t = 1 - p.life / p.maxLife;
      const screenY = candidateTopY() + BLOCK_H * 0.5 + p.screenYOffset;
      const alpha = (1 - t) * 0.6;
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = `hsl(${p.hue}, 92%, 70%)`;
      ctx.lineWidth = (1 - t) * 6 * baseScale + 1;
      ctx.shadowColor = `hsla(${p.hue}, 92%, 75%, 0.8)`;
      ctx.shadowBlur = 16 * baseScale;
      ctx.beginPath();
      ctx.arc(p.x, screenY, p.r, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
  }

  function drawFloatTexts() {
    for (const f of state.floatTexts) {
      const a = Math.max(0, f.life / f.maxLife);
      const screenY = candidateTopY() + BLOCK_H * 0.5 + f.screenYOffset;
      const fontSize = (f.big ? 30 : 20) * baseScale;
      ctx.globalAlpha = a;
      ctx.font = `${fontSize}px ui-monospace, Menlo, monospace`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = `hsl(${f.hue}, 95%, 70%)`;
      ctx.shadowColor = `hsla(${f.hue}, 95%, 75%, 0.85)`;
      ctx.shadowBlur = 12 * baseScale;
      ctx.fillText(f.text, f.x, screenY);
    }
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
  }

  function drawFlash() {
    if (state.flashAlpha <= 0) return;
    ctx.fillStyle = `rgba(255,255,255,${state.flashAlpha})`;
    ctx.fillRect(0, 0, W, H);
  }

  // ----- Loop ---------------------------------------------------------------
  let lastT = performance.now();
  let running = true;
  function tick(now) {
    if (!running) { lastT = now; requestAnimationFrame(tick); return; }
    const dt = Math.min(0.05, (now - lastT) / 1000);
    lastT = now;
    update(dt);

    // Shake
    const sx = (Math.random() - 0.5) * state.shake;
    const sy = (Math.random() - 0.5) * state.shake;
    ctx.save();
    ctx.translate(sx, sy);

    fillBackground();
    drawAmbient();
    drawReflection();
    drawTower();
    drawChunks();
    drawCandidate();
    drawPulses();
    drawSparks();
    drawFloatTexts();
    drawFlash();

    ctx.restore();
    requestAnimationFrame(tick);
  }
  requestAnimationFrame((t) => { lastT = t; tick(t); });

  document.addEventListener('visibilitychange', () => {
    running = document.visibilityState === 'visible';
    lastT = performance.now();
  });
})();
</script>
</body>
</html>
